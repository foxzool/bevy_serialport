[package]
name = "bevy_serialport"
version = "0.9.0"
edition = "2021"
rust-version = "1.70"
authors = ["FoxZoOL <zhooul@gmail.com>"]
description = "Async serial port plugin for Bevy game engine with enhanced error handling and convenience APIs"
readme = "README.md"
documentation = "https://docs.rs/bevy_serialport"
repository = "https://github.com/foxzool/bevy_serialport"
homepage = "https://github.com/foxzool/bevy_serialport"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "hardware", "serial", "tokio", "async"]
categories = ["game-development", "hardware-support", "asynchronous"]
exclude = ["target/", ".git/", ".idea/", ".vscode/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy_app = { version = "0.16.0" }
bevy_ecs = { version = "0.16.0" }
bevy_log = { version = "0.16.0" }
bevy_derive = { version = "0.16.0" }
bevy_utils = { version = "0.16.0" }
bytes = "1.8"
futures = "0.3"
parking_lot = { version = "0.12" }
thiserror = "2.0"
serialport = { version = "4.5", default-features = false }
tokio = { version = "1.40", features = ["parking_lot", "rt-multi-thread", "sync", "macros", "process", "time", "fs", "io-util"] }
tokio-util = { version = "0.7.12", features = ["codec"] }
tokio-serial = "5.4.4"

[dev-dependencies]
bevy = { version = "0.16.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
tempdir = "0.3"

[features]
default = []
utils = []

[[example]]
name = "serial_receiver"
path = "examples/receiver.rs"

[[example]]
name = "serial_sender"
path = "examples/sender.rs"

[[example]]
name = "advanced_usage"
path = "examples/advanced_usage.rs"
